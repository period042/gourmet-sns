name: Token Expiry Check & Auto-Refresh

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 09:00 JST
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check & refresh tokens
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error, base64, datetime, subprocess, sys
          sys.stdout.reconfigure(encoding='utf-8')

          REPO = "period042/gourmet-sns"
          METADATA_FILE = "token_metadata.json"
          NOW = datetime.datetime.now(datetime.timezone.utc)
          DAYS_WARN = 14   # 14日以内なら自動更新を試みる

          # ── メタデータ読み込み/保存（token_metadata.json in repo root） ───────
          def load_metadata():
              try:
                  with open(METADATA_FILE, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save_metadata(data):
              with open(METADATA_FILE, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", METADATA_FILE], check=True)
              r = subprocess.run(["git", "diff", "--staged", "--quiet"])
              if r.returncode != 0:
                  subprocess.run(["git", "commit", "-m", "chore: update token_metadata.json"], check=True)
                  subprocess.run(["git", "push"], check=True)

          # ── API ヘルパー ─────────────────────────────────────────────────────
          def api_get(url):
              """GETリクエスト。(success, data or error_code) を返す。"""
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      return True, json.load(r)
              except urllib.error.HTTPError as e:
                  try:
                      body = json.loads(e.read())
                      code = body.get("error", {}).get("code", e.code)
                  except Exception:
                      code = e.code
                  return False, code
              except Exception as e:
                  return False, str(e)

          def check_ig_valid(token):
              """Instagram tokenが有効か確認。(valid: bool, code: int|None)"""
              ok, result = api_get(f"https://graph.facebook.com/v22.0/me?access_token={token}")
              if ok:
                  return True, None
              return False, result

          def refresh_ig_token(token):
              """Instagram長期トークンを更新。(new_token, expires_in_seconds)"""
              ok, result = api_get(
                  f"https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token={token}"
              )
              if ok:
                  return result.get("access_token"), result.get("expires_in", 5184000)
              return None, None

          def check_threads_valid(token):
              ok, result = api_get(f"https://graph.threads.net/v1.0/me?access_token={token}")
              if ok:
                  return True, None
              return False, result

          def refresh_threads_token(token):
              ok, result = api_get(
                  f"https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token={token}"
              )
              if ok:
                  return result.get("access_token"), result.get("expires_in", 5184000)
              return None, None

          def set_secret(name, value):
              r = subprocess.run(
                  ["gh", "secret", "set", name, "--repo", REPO],
                  input=value.encode(), capture_output=True
              )
              if r.returncode != 0:
                  print(f"  [WARN] secret set失敗（PAT不足の可能性）: {r.stderr.decode()[:100]}")
              return r.returncode == 0

          def create_issue(title, body):
              r_list = subprocess.run(
                  ["gh", "issue", "list", "--repo", REPO, "--state", "open",
                   "--search", title[:40], "--json", "title"],
                  capture_output=True
              )
              existing = json.loads(r_list.stdout or "[]")
              if any(title[:30] in i.get("title", "") for i in existing):
                  print(f"  Issue既存のためスキップ: {title}")
                  return
              r = subprocess.run(
                  ["gh", "issue", "create", "--repo", REPO, "--title", title, "--body", body],
                  capture_output=True
              )
              url = r.stdout.strip().decode()
              print(f"  Issue作成: {url}")

          # ── メイン処理 ──────────────────────────────────────────────────────
          meta = load_metadata()
          meta_changed = False

          # ─── Instagram ───────────────────────────────────────────────────────
          ig_token = os.environ.get("IG_ACCESS_TOKEN", "")
          if ig_token:
              valid, code = check_ig_valid(ig_token)
              if not valid:
                  print(f"IG token: 無効 (code={code})")
                  create_issue(
                      "[Token] Instagram Token 失効済み",
                      f"IG_ACCESS_TOKENが失効または無効です（エラーcode: {code}）。\n\n**対応手順:**\n1. Meta Developer Console でユーザートークンを再発行\n2. `gh secret set IG_ACCESS_TOKEN -R {REPO}` で更新\n3. `token_metadata.json` の `ig_expires_at` を発行日+60日で更新"
                  )
              else:
                  ig_exp_str = meta.get("ig_expires_at")
                  if not ig_exp_str:
                      # 初回: 60日後をデフォルト設定
                      ig_exp = NOW + datetime.timedelta(days=60)
                      meta["ig_expires_at"] = ig_exp.isoformat()
                      meta_changed = True
                      print(f"IG token: 有効（期限不明 → デフォルト{ig_exp.strftime('%Y-%m-%d')}を設定）")
                  else:
                      ig_exp = datetime.datetime.fromisoformat(ig_exp_str)
                      days = (ig_exp - NOW).days
                      print(f"IG token: 有効、期限={ig_exp.strftime('%Y-%m-%d')} 残り{days}日")
                      if days <= DAYS_WARN:
                          print(f"  → 自動更新を試みます")
                          new_token, expires_in = refresh_ig_token(ig_token)
                          if new_token:
                              new_exp = NOW + datetime.timedelta(seconds=expires_in)
                              if set_secret("IG_ACCESS_TOKEN", new_token):
                                  meta["ig_expires_at"] = new_exp.isoformat()
                                  meta_changed = True
                                  create_issue(
                                      "[Token] Instagram Token 自動更新完了",
                                      f"IG_ACCESS_TOKENを自動更新しました。\n- 旧期限: {ig_exp.strftime('%Y-%m-%d')}\n- 新期限: {new_exp.strftime('%Y-%m-%d')}"
                                  )
                                  print(f"  IG token更新成功 → 新期限: {new_exp.strftime('%Y-%m-%d')}")
                              else:
                                  create_issue(
                                      f"[Token] Instagram Token Secret更新失敗（残り{days}日）",
                                      f"トークン更新は成功しましたがSecretへの保存が失敗しました。\n\nリポジトリにGH_PATを設定するか、手動でIG_ACCESS_TOKENを更新してください。\n- 期限: {ig_exp.strftime('%Y-%m-%d')}（残り{days}日）"
                                  )
                          else:
                              create_issue(
                                  f"[Token] Instagram Token 自動更新失敗（残り{days}日）",
                                  f"IG_ACCESS_TOKENの自動更新に失敗しました。\n\n手動でMeta Developer ConsoleからIG_ACCESS_TOKENを再発行してください。\n- 期限: {ig_exp.strftime('%Y-%m-%d')}（残り{days}日）"
                              )

          # ─── Threads ─────────────────────────────────────────────────────────
          th_token = os.environ.get("THREADS_ACCESS_TOKEN", "")
          if th_token:
              valid, code = check_threads_valid(th_token)
              if not valid:
                  print(f"Threads token: 無効 (code={code})")
                  create_issue(
                      "[Token] Threads Token 失効済み",
                      f"THREADS_ACCESS_TOKENが失効または無効です（エラーcode: {code}）。\n\n**対応:** Meta Developer Console（App 1510156694190451）でTHREADS_ACCESS_TOKENを再発行してください。"
                  )
              else:
                  th_exp_str = meta.get("threads_expires_at")
                  if not th_exp_str:
                      th_exp = NOW + datetime.timedelta(days=60)
                      meta["threads_expires_at"] = th_exp.isoformat()
                      meta_changed = True
                      print(f"Threads token: 有効（期限不明 → デフォルト{th_exp.strftime('%Y-%m-%d')}を設定）")
                  else:
                      th_exp = datetime.datetime.fromisoformat(th_exp_str)
                      days = (th_exp - NOW).days
                      print(f"Threads token: 有効、期限={th_exp.strftime('%Y-%m-%d')} 残り{days}日")
                      if days <= DAYS_WARN:
                          print(f"  → 自動更新を試みます")
                          new_token, expires_in = refresh_threads_token(th_token)
                          if new_token:
                              new_exp = NOW + datetime.timedelta(seconds=expires_in)
                              if set_secret("THREADS_ACCESS_TOKEN", new_token):
                                  meta["threads_expires_at"] = new_exp.isoformat()
                                  meta_changed = True
                                  create_issue(
                                      "[Token] Threads Token 自動更新完了",
                                      f"THREADS_ACCESS_TOKENを自動更新しました。\n- 旧期限: {th_exp.strftime('%Y-%m-%d')}\n- 新期限: {new_exp.strftime('%Y-%m-%d')}"
                                  )
                                  print(f"  Threads token更新成功 → 新期限: {new_exp.strftime('%Y-%m-%d')}")
                              else:
                                  create_issue(
                                      f"[Token] Threads Token Secret更新失敗（残り{days}日）",
                                      f"トークン更新は成功しましたがSecretへの保存が失敗しました。\n残り{days}日です。手動でTHREADS_ACCESS_TOKENを更新してください。"
                                  )
                          else:
                              create_issue(
                                  f"[Token] Threads Token 自動更新失敗（残り{days}日）",
                                  f"THREADS_ACCESS_TOKENの自動更新に失敗しました。\n\n**対応:** Meta Developer Console（App 1510156694190451）でTHREADS_ACCESS_TOKENを手動更新してください。\n- 期限: {th_exp.strftime('%Y-%m-%d')}（残り{days}日）"
                              )

          if meta_changed:
              save_metadata(meta)

          print("チェック完了")
          PYEOF
